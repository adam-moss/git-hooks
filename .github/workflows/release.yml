name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish source release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and project tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          cache: true

      - name: Verify signed tag and release target
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git verify-tag "$TAG"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Run release validation
        run: mise run ci

      - name: Build source archives and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          git archive --format=tar.gz --prefix="git-hooks-$TAG/" "$TAG" >"dist/git-hooks-$TAG.tar.gz"
          git archive --format=zip --prefix="git-hooks-$TAG/" "$TAG" >"dist/git-hooks-$TAG.zip"
          (
            cd dist
            sha256sum "git-hooks-$TAG.tar.gz" "git-hooks-$TAG.zip" >SHA256SUMS
          )

      - name: Attest release archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/*             --verify-tag             --title "$TAG"             --generate-notes
