name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish versioned documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install mise and project tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: true
          cache: false
      - name: Build documentation
        run: zensical build --strict --site-dir site
      - name: Publish versioned site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
            root_target="latest"
          else
            version="dev"
            root_target="dev"
          fi

          mkdir .pages
          git -C .pages init --initial-branch=gh-pages
          git -C .pages config user.name "github-actions[bot]"
          git -C .pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .pages remote add origin "https://github.com/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C .pages config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"

          if git -C .pages ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git -C .pages fetch --no-tags origin gh-pages
            git -C .pages reset --hard FETCH_HEAD
          fi

          rm -rf ".pages/$version"
          mkdir -p ".pages/$version"
          cp -R site/. ".pages/$version/"

          if [ "$REF_TYPE" = "tag" ]; then
            rm -rf .pages/latest
            mkdir -p .pages/latest
            cp -R site/. .pages/latest/
          fi

          cat >.pages/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=$root_target/">
              <title>Git Hooks documentation</title>
            </head>
            <body><p><a href="$root_target/">Git Hooks documentation</a></p></body>
          </html>
          HTML

          git -C .pages add --all
          if ! git -C .pages diff --cached --quiet; then
            git -C .pages commit -m "Publish documentation for $version"
            git -C .pages push origin gh-pages
          fi
